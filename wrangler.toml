# ---------------------------------------------------------------------------
# Social Studio — Cloudflare Worker config
#
# `npm run setup` fills in `database_id` and `PUBLIC_BASE_URL` for you — you
# should not need to touch this file at all. Edit it by hand only if you are
# setting up manually. See README.md.
# ---------------------------------------------------------------------------

name = "social-studio"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The scheduled posts live on Upload-Post's servers, so they fire whether or
# not this Worker is awake. This cron just wakes up every 10 minutes to ask
# "did they actually go out?" and update the dashboard.
[triggers]
crons = ["*/10 * * * *"]

# Lets us `import ui from "./ui.html"` and get the file as a string.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

# The scheduling database (posts, captions, audit results, job status).
[[d1_databases]]
binding = "DB"
database_name = "social-studio"
# Daniel's D1 database, created in the Cloudflare dashboard on 2026-09-20.
# If you fork this, replace it with your own: the Deploy to Cloudflare button
# creates one and fills this in automatically, and `npm run setup` does the same.
database_id = "eac9eef9-160f-420f-bec9-d833362b8aaa"
migrations_dir = "migrations"

# Where your videos and images are stored so Upload-Post can fetch them.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "social-studio-media"

[vars]
# Your posting timezone. Used for the calendar and for scheduling.
DEFAULT_TIMEZONE = "America/Los_Angeles"

# PUBLIC_BASE_URL is deliberately not set here. The Worker uses its own
# incoming request URL, which is right in every normal case and needs no
# configuration. Set it only if you put the tool behind a custom domain AND
# media fetching breaks: Worker -> Settings -> Variables and Secrets.

[observability]
enabled = true
